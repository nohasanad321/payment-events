
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-events
  namespace: payment-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-events
  template:
    metadata:
      labels:
        app: payment-events
    spec:
      containers:
        - name: payment-events
          image: payment-events-payment-events:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-events
  namespace: payment-lab
spec:
  type: ClusterIP
  selector:
    app: payment-events
  ports:
    - port: 8080
      targetPort: 8080
